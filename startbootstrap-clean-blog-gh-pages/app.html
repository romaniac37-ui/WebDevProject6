<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap for quick layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle, #1f1c2c, #928dab);
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .game-box {
            background: rgba(255,255,255,0.08);
            padding: 30px;
            border-radius: 15px;
            margin-top: 60px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .btn-choice {
            font-size: 20px;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 12px;
            transition: 0.2s;
        }

        .btn-choice:hover {
            transform: scale(1.1);
        }

        .scoreboard {
            margin-top: 20px;
            font-size: 18px;
        }

        #result {
            font-size: 24px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="game-box">

        <h1>Rock Paper Scissors</h1>
        <p>Choose your move and play against the computer</p>

        <!-- Buttons -->
        <div>
            <button class="btn btn-primary btn-choice" onclick="play('rock')">Rock</button>
            <button class="btn btn-success btn-choice" onclick="play('paper')">Paper</button>
            <button class="btn btn-danger btn-choice" onclick="play('scissors')">Scissors</button>
        </div>

        <!-- Result -->
        <div id="result">Make your move!</div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <p>Player Score: <span id="playerScore">0</span></p>
            <p>Computer Score: <span id="computerScore">0</span></p>
            <p>Ties: <span id="ties">0</span></p>
        </div>

        <button class="btn btn-light mt-3" onclick="resetGame()">Reset Game</button>

    </div>

</div>

<script>
let playerScore = 0;
let computerScore = 0;
let ties = 0;

function play(playerChoice) {
    const choices = ["rock", "paper", "scissors"];
    const computerChoice = choices[Math.floor(Math.random() * 3)];

    let resultText = "";

    if (playerChoice === computerChoice) {
        resultText = "It's a tie!";
        ties++;
    } 
    else if (
        (playerChoice === "rock" && computerChoice === "scissors") ||
        (playerChoice === "paper" && computerChoice === "rock") ||
        (playerChoice === "scissors" && computerChoice === "paper")
    ) {
        resultText = "You win!";
        playerScore++;
    } 
    else {
        resultText = "You lose!";
        computerScore++;
    }

    document.getElementById("result").innerText =
        `You chose ${playerChoice}, computer chose ${computerChoice}. ${resultText}`;

    document.getElementById("playerScore").innerText = playerScore;
    document.getElementById("computerScore").innerText = computerScore;
    document.getElementById("ties").innerText = ties;
}

function resetGame() {
    playerScore = 0;
    computerScore = 0;
    ties = 0;

    document.getElementById("playerScore").innerText = 0;
    document.getElementById("computerScore").innerText = 0;
    document.getElementById("ties").innerText = 0;

    document.getElementById("result").innerText = "Make your move!";
}
</script>

</body>
</html>
